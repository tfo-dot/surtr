[package]
name = "surtr-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
surtr-protocol = { path = "../surtr-protocol" }
tokio = { version = "1.38", features = ["full"] }
postcard = { version = "1.0", features = ["use-std"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde_yaml = "0.9"
