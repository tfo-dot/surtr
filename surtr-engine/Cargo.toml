[package]
name = "surtr-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
surtr-protocol = { path = "../surtr-protocol" }
tokio = { version = "1.38", features = ["full"] }
petgraph = "0.6"
notify = "6.1"
pulldown-cmark = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
postcard = { version = "1.0", features = ["use-std"] }
anyhow = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
